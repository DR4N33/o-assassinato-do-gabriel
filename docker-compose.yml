# O Assassinato do Gabriel — docker compose
#
#   cp .env.example .env      # e define ADMIN_PASSWORD
#   docker compose up -d --build
#   → http://<ip-do-servidor>:8080   (organização: http://<ip>:8080/?mode=admin)
#
# Acesso pela internet sem abrir portas (Rosa fora de casa, convidados com dados móveis):
#   - sem domínio: Tailscale Funnel → TS_AUTHKEY no .env → docker compose --profile funnel up -d --build
#   - com domínio no Cloudflare: TUNNEL_TOKEN no .env → docker compose --profile tunnel up -d --build

services:
  app:
    build: .
    image: o-assassinato-do-gabriel:latest
    container_name: assassinato-gabriel
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD no ficheiro .env}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - festa-data:/data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: assassinato-gabriel-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles: ["tunnel"]

  # Endereço público fixo sem domínio e sem abrir portas (Tailscale Funnel):
  #   define TS_AUTHKEY no .env e arranca com: docker compose --profile funnel up -d --build
  funnel:
    image: tailscale/tailscale:stable
    container_name: assassinato-gabriel-funnel
    hostname: assassinato-gabriel
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - app
    profiles: ["funnel"]

volumes:
  festa-data:
  tailscale-state:
